# Roslyn VS integration test gate pipeline for real-signed Visual Studio builds.

# No CI (push) builds.
trigger: none

# A `pr:` block (not `pr: none`) is required so this pipeline can be launched from a
# GitHub PR by an authorized user commenting `/azp run <pipeline-name>`. This replaces
# the former `.github/workflows/pr-validation.yml` GitHub Actions launcher (and the Corp
# tenant Federated Identity Credential it relied on) for the old `/dart` command.
#
# IMPORTANT: In the pipeline's Triggers settings in Azure DevOps, enable
# "Override the YAML pull request trigger from here" and DISABLE automatic pull request
# validation so this only ever runs when an authorized user comments `/azp run`.
pr:
  branches:
    include:
    - main
    - release/*
    - feature/*

resources:
  repositories:
  - repository: DartLabTemplates
    type: git
    name: DevDiv/DartLab.Templates
    ref: refs/heads/main
  - repository: VSTemplates
    type: git
    name: DevDiv/VS.Templates
    ref: refs/heads/main
  - repository: RoslynMirror
    endpoint: dnceng-internal-code-access
    type: git
    name: internal/dotnet-roslyn
    # The build runs on the PR's base (target) branch of the internal mirror, then
    # setup-pr-validation.ps1 fetches the PR head/merge from GitHub by PR number. Under a
    # native GitHub PR trigger `Build.SourceBranch` is `refs/pull/N/merge` (which does not
    # exist in the mirror), so check out the PR's target branch instead. This variable is
    # only populated for PR runs, so this pipeline is expected to be launched from a PR
    # (via `/azp run`); manual non-PR runs must specify a valid mirror ref.
    ref: $(System.PullRequest.TargetBranch)

parameters:
  # When launched via `/azp run`, no template parameters are supplied, so prNumber/sha
  # fall back to the built-in PR variables that Azure Pipelines populates for GitHub PR
  # runs. Explicit values (manual "Run pipeline") still override these defaults.
  - name: prNumber
    type: string
    default: $(System.PullRequest.PullRequestNumber)
  - name: sha
    type: string
    default: $(System.PullRequest.SourceCommitId)
  - name: EnforceLatestCommit
    type: boolean
    default: true
  - name: visualStudioBootstrapperURI
    type: string
    default: '(default)'
  - name: testCaseFilter
    type: string
    default: '(all)'
  - name: skipCustomRoslynDeploy
    type: boolean
    default: false
  - name: testsCommitHash
    type: string
    default: '(default)'
  - name: testsCommitFromVisualStudioBuild
    type: boolean
    default: false
  # Set to 'stop' if you want to keep the test machines around for investigation after test completion.
  - name: testMachineCleanUpStrategy
    displayName: Test Machine Clean Up Strategy
    type: string
    default: delete
    values:
    - delete
    - stop
  # The retention period for the test machine (expressed as <Days>:<Hours>:<Minutes>:<Seconds>)
  - name: testMachineRetention
    displayName: Test Machine Retention (format "D:H:M:S")
    type: string
    default: 1:0:0:0 # 1 day default

extends:
  template: /DartLab/1ES/pipelines/ci/real-sign.yml@VSTemplates
  parameters:
    testStages:
    - template: /eng/pipelines/test-gates/staging/stages.yml@self
      parameters:
        prNumber: ${{ parameters.prNumber }}
        sha: ${{ parameters.sha }}
        EnforceLatestCommit: ${{ parameters.EnforceLatestCommit }}
        visualStudioBootstrapperURI: ${{ parameters.visualStudioBootstrapperURI }}
        testCaseFilter: ${{ parameters.testCaseFilter }}
        skipCustomRoslynDeploy: ${{ parameters.skipCustomRoslynDeploy }}
        testsCommitHash: ${{ parameters.testsCommitHash }}
        testsCommitFromVisualStudioBuild: ${{ parameters.testsCommitFromVisualStudioBuild }}
        testMachineCleanUpStrategy: ${{ parameters.testMachineCleanUpStrategy }}
        testMachineRetention: ${{ parameters.testMachineRetention }}
